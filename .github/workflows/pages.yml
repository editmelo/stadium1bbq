name: Deploy to GitHub Pages

# Publishes the site on every push to main. `configure-pages` below turns
# Pages on by itself the first time this runs, so no repo setting needs
# changing by hand.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Turn Pages on if it isn't already
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # The site is plain static files, so the repo root is the artifact.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
